---
apiVersion: v1
kind: Secret
metadata:
  name: namecheap-api-credentials
  namespace: kube-system
type: Opaque
stringData:
  NAMECHEAP_API_KEY: "your_api_key"
  NAMECHEAP_USERNAME: "your_username"
  NAMECHEAP_API_USER: "your_api_user"
  NAMECHEAP_CLIENT_IP: "your_whitelisted_ip"
  NAMECHEAP_SANDBOX: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-namecheap-webhook
  namespace: kube-system
  labels:
    app: external-dns-namecheap-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns-namecheap-webhook
  template:
    metadata:
      labels:
        app: external-dns-namecheap-webhook
    spec:
      containers:
      - name: webhook
        image: your-registry/external-dns-namecheap-webhook:latest
        ports:
        - containerPort: 8888
          name: http
        - containerPort: 8080
          name: metrics
        envFrom:
        - secretRef:
            name: namecheap-api-credentials
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: external-dns-namecheap-webhook
  namespace: kube-system
spec:
  selector:
    app: external-dns-namecheap-webhook
  ports:
  - port: 8888
    targetPort: 8888
    name: http
  - port: 8080
    targetPort: 8080
    name: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: kube-system
  labels:
    app: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      containers:
      - name: external-dns
        image: k8s.gcr.io/external-dns/external-dns:v0.13.1
        args:
        - --source=service
        - --source=ingress
        - --provider=webhook
        - --webhook-provider-url=http://external-dns-namecheap-webhook:8888
        - --registry=txt
        - --txt-owner-id=k8s
        - --interval=1m
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
